openapi: 3.1.0
info:
  title: bauphysik.net API
  version: 0.2.0
  summary: Read access to bauphysik.net projects, calculations and exports.
  description: |
    The bauphysik.net API gives read access to the projects and calculations of
    a bauphysik.net account. It returns the stored input and result data of
    each calculation and creates project exports as JSON or as a ZIP archive
    with PDF reports.

    **Authentication:** Every request needs an API token in the
    `Authorization: Bearer <token>` header. Tokens are created in the
    bauphysik.net user profile and require an active Pro or administrator
    account. The token is shown only once when it is created.

    **Access:** A token sees the same projects as its account: the account's own
    projects and, with team features enabled, the projects of Pro members of the
    same team.

    **Errors:** Error responses are JSON objects with an `error` field. Some
    messages are in German.

    **Rate limits:** see the `RateLimited` response. Exports additionally consume
    compute units from an hourly budget, see `POST /api/project/{project_uuid}/export`.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: bauphysik.net
    url: https://bauphysik.net
servers:
  - url: https://bauphysik.net
security:
  - bearerAuth: []
tags:
  - name: Projects
  - name: Calculations
  - name: Exports
  - name: Materials
paths:
  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List the projects accessible to the token
      description: Projects are sorted by name.
      responses:
        "200":
          description: Accessible projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
              example:
                projects:
                  - uuid: 3f1c9a52-7d1e-4f0b-9c55-2a8e0d6b4c11
                    name: Einfamilienhaus Musterstraße 1
                    project_id: 4812
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/{project_uuid}/:
    get:
      tags: [Calculations]
      operationId: listCalculations
      summary: List the calculations of a project
      description: |
        Returns the calculations of the project, newest first. Use `calc_uuid`
        with `GET /api/calculations/{calc_uuid}`; it stays the same when a
        calculation is renamed. `calculation_names` is kept for older clients.
      parameters:
        - $ref: "#/components/parameters/ProjectUuid"
        - name: module
          in: query
          required: false
          description: Only calculations of this module, for example `datenerfassung`.
          schema:
            type: string
      responses:
        "200":
          description: Calculations of the project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationNameList"
              example:
                project_uuid: 3f1c9a52-7d1e-4f0b-9c55-2a8e0d6b4c11
                calculation_names:
                  - Außenwand Bestand
                calculations:
                  - calc_uuid: 8b0e4c1d-2f5a-4e3b-9a6c-7d8e9f0a1b2c
                    calc_name: Außenwand Bestand
                    module_name: uwert_glaser_din4108-3
                    created_at: "2026-11-10T09:30:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/{project_uuid}/{calc_name}:
    get:
      tags: [Calculations]
      operationId: getCalculation
      summary: Get input and result data of one calculation
      description: |
        Returns the stored input and result data of the newest calculation with
        this name in the project. The structure of `input_data` and
        `result_data` depends on the calculation module (`module_name`).

        Calculation names can be renamed by users. Store `calc_uuid` if you need
        a stable reference and use `GET /api/calculations/{calc_uuid}`.
      parameters:
        - $ref: "#/components/parameters/ProjectUuid"
        - name: calc_name
          in: path
          required: true
          description: |
            Short calculation name from `listCalculations`. Percent-encode the
            name as one path segment, including `/` as `%2F`.
          schema:
            type: string
          example: Außenwand Bestand
      responses:
        "200":
          description: The calculation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Project not found, no permission, or no calculation with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Calculation not found in this project
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/calculations/{calc_uuid}:
    get:
      tags: [Calculations]
      operationId: getCalculationByUuid
      summary: Get one calculation by its stable id
      description: |
        Same content as `GET /api/{project_uuid}/{calc_name}`. `project_uuid` is
        the first accessible project the calculation is linked to, or `null`.
      parameters:
        - $ref: "#/components/parameters/CalcUuid"
      responses:
        "200":
          description: The calculation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CalculationNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [Calculations]
      operationId: updateCalculation
      summary: Replace the input of a calculation
      description: |
        Validates and calculates the new input and replaces the stored one. The
        previous state is first saved as a calculation of its own, named
        `<name> [vorher <date time>]`, in the same projects. `calc_uuid` stays the
        same. Only for modules from `GET /api/modules`.
      parameters:
        - $ref: "#/components/parameters/CalcUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "200":
          description: Calculation updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedCalculation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CalculationLimit"
        "404":
          $ref: "#/components/responses/CalculationNotFound"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/calculations/{calc_uuid}/din4108-3:
    get:
      tags: [Calculations]
      operationId: getDin4108_3Layers
      summary: Get a DIN 4108-3 calculation as a simple layer list
      description: |
        For calculations of module `uwert_glaser_din4108-3`: the layer
        structure in a simplified form (`simple_data`), as used for creating and
        checking such calculations.
      parameters:
        - $ref: "#/components/parameters/CalcUuid"
      responses:
        "200":
          description: The layer structure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Din4108_3Layers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CalculationNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/materials:
    get:
      tags: [Materials]
      operationId: searchMaterials
      summary: Search the material catalog for DIN 4108-3
      description: |
        Without `manufacturer` the generic catalog with typical design values.
        With `manufacturer=1` values from manufacturer data sheets instead.
        Results are ranked by match; without `q` the catalog is listed.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          example: Holzfaser
        - name: manufacturer
          in: query
          required: false
          description: "`1` for manufacturer data sheet values."
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Matching materials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Catalog not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/search:
    get:
      tags: [Calculations]
      operationId: searchCalculations
      summary: Full-text search over the accessible calculations
      description: |
        Searches the input data of calculations of the modules
        `uwert_glaser_din4108-3`, `uw_din_en_iso_10077-1`, `wb_din10211`,
        `wb_konzept` and `datenerfassung`, for example for a layer structure that
        was calculated before. Only calculations the token can access.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: Ziegel
        - name: module
          in: query
          required: false
          schema:
            type: string
        - name: project_uuid
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Matching calculations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          description: Missing query or module without search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/modules:
    get:
      tags: [Calculations]
      operationId: listApiModules
      summary: List the modules that can be calculated, created and updated
      responses:
        "200":
          description: Modules with API write access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/modules/{module_name}/execute:
    post:
      tags: [Calculations]
      operationId: executeModule
      summary: Calculate without saving
      description: |
        Runs the calculation on the server and returns the result. Nothing is
        stored. The input schema per module is listed under `x-modules` in
        `schemas/calculation-inputs.json`; for `uwert_glaser_din4108-3` either
        `input_data` or the simplified `simple_data`. Books the module's compute
        units into the hourly compute budget.
      parameters:
        - $ref: "#/components/parameters/ModuleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "200":
          description: Result of the calculation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ModuleNotAvailable"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_uuid}/calculations:
    post:
      tags: [Calculations]
      operationId: createCalculation
      summary: Create a calculation in a project
      description: |
        Validates, calculates and stores a new calculation in the project. Never
        overwrites: if the name exists, the answer is `409` with
        `existing_calc_uuid`; use `PUT /api/calculations/{calc_uuid}` to change
        it. The stored name is prefixed with the project name. Counts against the
        compute budget and the maximum number of calculations per account.
      parameters:
        - $ref: "#/components/parameters/ProjectUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalculationRequest"
      responses:
        "201":
          description: Calculation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCalculation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CalculationLimit"
        "404":
          description: Project not found, no permission, or module not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A calculation with this name already exists.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    required: [existing_calc_uuid]
                    properties:
                      existing_calc_uuid:
                        type: string
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/project/{project_uuid}/export-json:
    get:
      tags: [Exports]
      operationId: exportProjectJson
      summary: Export all calculations of a small project as JSON
      description: |
        Runs every calculation of the project again and returns the results in
        one JSON document. Synchronous, therefore only for small projects
        (currently up to 25 compute units). Larger projects receive `409`; use
        `POST /api/project/{project_uuid}/export?format=json` instead. The run
        counts against the hourly export budget.
      parameters:
        - $ref: "#/components/parameters/ProjectUuid"
      responses:
        "200":
          description: The project export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFoundOrEmpty"
        "409":
          $ref: "#/components/responses/TooLargeForSync"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/project/{project_uuid}/export-pdf:
    get:
      tags: [Exports]
      operationId: exportProjectZip
      summary: Export a small project as ZIP with PDF reports
      description: |
        Synchronous ZIP export for small projects, same limits as
        `export-json`. Larger projects receive `409`; use
        `POST /api/project/{project_uuid}/export` instead. The ZIP layout is
        described in the `ExportArchive` schema.
      parameters:
        - $ref: "#/components/parameters/ProjectUuid"
      responses:
        "200":
          description: ZIP archive.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="Einfamilienhaus_export.zip"
          content:
            application/zip:
              schema:
                $ref: "#/components/schemas/ExportArchive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFoundOrEmpty"
        "409":
          $ref: "#/components/responses/TooLargeForSync"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/project/{project_uuid}/export:
    post:
      tags: [Exports]
      operationId: startProjectExport
      summary: Start a background export
      description: |
        Queues an export of the whole project and returns `202` with the job.
        Poll `status_url` until `status` is `completed`, then fetch
        `download_url` once. The file is deleted after the first download or at
        the end of the day (Europe/Berlin), but is kept for at least 60 minutes.

        If an export of the same project and format is already queued or
        running, that job is returned with `created: false`.

        Limits (current values, subject to change):

        - one active background export per account,
        - 1500 compute units per account and hour, shared with the synchronous
          exports and with calculations run in the web interface,
        - at most 1000 compute units per project.

        Each calculation costs at least one compute unit.
      parameters:
        - $ref: "#/components/parameters/ProjectUuid"
        - name: format
          in: query
          required: false
          description: "`zip` (default) for the ZIP archive, `json` for the `export-json` document."
          schema:
            type: string
            enum: [zip, json]
            default: zip
      responses:
        "202":
          description: Export job queued, or the already active job.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ExportJob"
                  - type: object
                    required: [created]
                    properties:
                      created:
                        type: boolean
                        description: "`false` if an active job for this project and format was returned."
        "400":
          description: Unknown export format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFoundOrEmpty"
        "422":
          description: Project exceeds the maximum export size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Request rate limit (see `RateLimited`), hourly export budget used
            up, or another background export still running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/project/{project_uuid}/export/{job_id}:
    get:
      tags: [Exports]
      operationId: getExportJob
      summary: Get the status of a background export
      parameters:
        - $ref: "#/components/parameters/ProjectUuid"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Export job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/project/{project_uuid}/export/{job_id}/download:
    get:
      tags: [Exports]
      operationId: downloadExport
      summary: Download a finished background export
      description: |
        Returns the ZIP archive (`format=zip`) or the JSON document
        (`format=json`). The file is deleted after this download.
      parameters:
        - $ref: "#/components/parameters/ProjectUuid"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The export file.
          content:
            application/zip:
              schema:
                $ref: "#/components/schemas/ExportArchive"
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "409":
          description: Export not ready, already downloaded or expired.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      status:
                        $ref: "#/components/schemas/ExportJobStatus"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token from the bauphysik.net user profile (Pro or administrator account).

  parameters:
    ProjectUuid:
      name: project_uuid
      in: path
      required: true
      description: Project UUID from `listProjects`.
      schema:
        type: string
      example: 3f1c9a52-7d1e-4f0b-9c55-2a8e0d6b4c11
    CalcUuid:
      name: calc_uuid
      in: path
      required: true
      description: "`calc_uuid` from `listCalculations` or a search result."
      schema:
        type: string
    ModuleName:
      name: module_name
      in: path
      required: true
      description: Module from `GET /api/modules`, for example `fl_din277`.
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      description: "`id` of the export job."
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing, invalid or revoked token, or the account has no Pro access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              value:
                error: Missing Bearer token
            invalid:
              value:
                error: Invalid or revoked token
    RateLimited:
      description: |
        Too many requests. Current limits: 120 requests per minute and 3000 per
        hour per account; 20 failed authentication attempts per minute and 200
        per hour per IP address. Wait for the number of seconds in
        `Retry-After`.
      headers:
        Retry-After:
          description: Seconds until the next request is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too many requests (120/60s). Retry in about 12s.
    ProjectNotFound:
      description: Project does not exist or the token has no access to it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Project not found or no permission
    ProjectNotFoundOrEmpty:
      description: Project does not exist, the token has no access to it, or no calculations are linked to it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Request body missing or not a JSON object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModuleNotAvailable:
      description: Module not available for API calculations.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  available_modules:
                    type: array
                    items:
                      type: string
    InvalidInput:
      description: |
        Input does not match the module's schema (`details` with field paths), or
        the calculation failed. A failed calculation returns a hint instead of the
        technical error; the web interface shows the error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    CalculationLimit:
      description: The account reached the maximum number of calculations (currently 20 000).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CalculationNotFound:
      description: Calculation does not exist or the token has no access to it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    JobNotFound:
      description: Project or export job not found for this account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Export job not found
    TooLargeForSync:
      description: Project is too large for a synchronous export. Use the background export.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            required: [loc, msg]
            properties:
              loc:
                type: string
                description: Field path, for example `layers.1.thickness_m`.
              msg:
                type: string

    ModuleList:
      type: object
      required: [modules]
      properties:
        modules:
          type: array
          items:
            type: object
            required: [module_name, name]
            properties:
              module_name:
                type: string
              name:
                type: string

    ExecuteRequest:
      type: object
      description: |
        `input_data` in the module's schema (`x-modules` in
        `schemas/calculation-inputs.json`), or for `uwert_glaser_din4108-3`
        alternatively `simple_data`.
      properties:
        input_data:
          type: object
        simple_data:
          $ref: "schemas/calculation-inputs.json#/components/schemas/SimpleDin4108_3"

    ExecuteResult:
      type: object
      required: [module_name, result_data]
      properties:
        module_name:
          type: string
        result_data:
          description: Module-specific result.
        simple_data:
          type: object
          description: Normalized layer structure, only with `simple_data` input.

    CreateCalculationRequest:
      oneOf:
        - type: object
          title: Create_Input_datenerfassung
          required: [module_name, calc_name, input_data]
          additionalProperties: false
          properties:
            module_name:
              const: datenerfassung
            calc_name:
              type: string
              minLength: 1
              maxLength: 150
            input_data:
              $ref: "schemas/calculation-inputs.json#/components/schemas/Input_datenerfassung"
        - type: object
          title: Create_Input_fl_din277
          required: [module_name, calc_name, input_data]
          additionalProperties: false
          properties:
            module_name:
              const: fl_din277
            calc_name:
              type: string
