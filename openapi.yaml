    CreatedCalculation:
      type: object
      required: [project_uuid, calc_uuid, calc_name, module_name, link_notes]
      properties:
        project_uuid:
          type: string
        calc_uuid:
          type: string
        calc_name:
          type: string
          description: Stored name, prefixed with the project name.
        module_name:
          type: string
        link_notes:
          type: array
          items:
            type: string
        simple_data:
          type: object
        result_data:
          description: Only with `simple_data` input.

    UpdatedCalculation:
      type: object
      required: [calc_uuid, calc_name, module_name, backup_calc_uuid, backup_calc_name, link_notes]
      properties:
        calc_uuid:
          type: string
        calc_name:
          type: string
        module_name:
          type: string
        backup_calc_uuid:
          type: string
          description: Calculation holding the previous state.
        backup_calc_name:
          type: string
        link_notes:
          type: array
          items:
            type: string

    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"

    ProjectSummary:
      type: object
      required: [uuid, name, project_id]
      properties:
        uuid:
          type: string
        name:
          type: string
        project_id:
          type: integer

    CalculationNameList:
      type: object
      required: [project_uuid, calculation_names]
      properties:
        project_uuid:
          type: string
        calculation_names:
          type: array
          description: Short names, kept for older clients.
          items:
            type: string
        calculations:
          type: array
          items:
            $ref: "#/components/schemas/CalculationSummary"

    CalculationSummary:
      type: object
      required: [calc_uuid, calc_name, module_name, created_at]
      properties:
        calc_uuid:
          type: string
        calc_name:
          type: string
        module_name:
          type: string
        created_at:
          type: [string, "null"]
          format: date-time

    Din4108_3Layers:
      type: object
      required: [project_uuid, calc_uuid, calc_name, module_name, simple_data]
      properties:
        project_uuid:
          type: [string, "null"]
        calc_uuid:
          type: string
        calc_name:
          type: string
        module_name:
          type: string
        simple_data:
          type: object
          description: Layers, boundary conditions and component category in simplified form.

    MaterialList:
      type: object
      required: [query, manufacturer, count, materials]
      properties:
        query:
          type: string
        manufacturer:
          type: boolean
        count:
          type: integer
        materials:
          type: array
          items:
            $ref: "#/components/schemas/Material"

    Material:
      type: object
      required: [name, lambda, mu1, mu2, density, specific_heat]
      properties:
        manufacturer:
          type: string
          description: Only with `manufacturer=1`.
        name:
          type: string
        lambda:
          type: [number, "null"]
          description: Thermal conductivity in W/(m·K).
        mu1:
          type: [number, "null"]
          description: Water vapour diffusion resistance factor, lower value.
        mu2:
          type: [number, "null"]
          description: Water vapour diffusion resistance factor, upper value.
        density:
          type: [number, "null"]
          description: Density in kg/m³.
        specific_heat:
          type: [number, "null"]
          description: Specific heat capacity in J/(kg·K).
        match_score:
          type: integer
        match_reasons:
          type: array
          items:
            type: string

    SearchResult:
      type: object
      required: [query, count, calculations]
      properties:
        query:
          type: string
        count:
          type: integer
        calculations:
          type: array
          items:
            type: object
            required: [calc_uuid, module_name, calc_name]
            properties:
              calc_uuid:
                type: string
              module_name:
                type: string
              calc_name:
                type: string
              project_uuid:
                type: [string, "null"]
              project_name:
                type: [string, "null"]
              created_at:
                type: [string, "null"]
                format: date-time
              matched_terms:
                type: array
                items:
                  type: string

    Calculation:
      type: object
      required: [project_uuid, calc_uuid, module_name, calc_name, calc_name_full, created_at, input_data, result_data]
      properties:
        project_uuid:
          type: [string, "null"]
          description: First accessible project the calculation is linked to.
        calc_uuid:
          type: string
          description: Stable ID of the calculation. Does not change when the calculation is renamed.
        module_name:
          type: string
          description: Calculation module, for example `uwert_glaser_din4108-3`.
        calc_name:
          type: string
          description: Short name as requested.
        calc_name_full:
          type: string
          description: Full stored name, may carry a module prefix.
        created_at:
          type: [string, "null"]
          format: date-time
        input_data:
          description: Module-specific input data.
        result_data:
          description: Module-specific result data, `null` if no result is stored.

    ProjectExport:
      type: object
      required: [project_name, project_id, project_uuid, export_date, calculations]
      properties:
        project_name:
          type: string
        project_id:
          type: integer
        project_uuid:
          type: string
        export_date:
          type: string
          format: date-time
        calculations:
          type: array
          items:
            $ref: "#/components/schemas/ExportedCalculation"

    ExportedCalculation:
      type: object
      required: [module_name, calc_name, calc_id, input, output]
      properties:
        module_name:
          type: string
        calc_name:
          type: string
        calc_id:
          type: integer
        input:
          description: Module-specific input data.
        output:
          description: Module-specific result of the new run.
        error:
          type: string
          description: |
            Present if the calculation failed during the export. Contains a
            German hint with the calculation ID, not the technical error. Run
            the calculation in the bauphysik.net web interface to see the error.

    ExportJobStatus:
      type: string
      enum: [queued, running, completed, failed, downloaded, expired]

    ExportJob:
      type: object
      required: [id, status, status_url, download_url]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/ExportJobStatus"
        message:
          type: [string, "null"]
          description: Progress or error message, in German.
        done:
          type: [integer, "null"]
          description: Calculations processed so far.
        total:
          type: [integer, "null"]
          description: Calculations in the export.
        cost_units:
          type: [integer, "null"]
        format:
          type: string
          enum: [zip, json]
        file_name:
          type: [string, "null"]
        expires_at:
          type: [string, "null"]
          format: date-time
        status_url:
          type: string
          description: Relative URL of this job.
        download_url:
          type: [string, "null"]
          description: Relative download URL, set only while `status` is `completed`.

    ExportArchive:
      type: string
      contentMediaType: application/zip
      description: |
        ZIP archive with one folder named after the project:

        - `json/<name>.json`: input and output of each calculation,
        - `pdf/<name>.pdf`: PDF report of each calculation,
        - `errors/<name>.txt`: calculations that failed,
        - `pdf_skipped/<name>.txt`: modules without a PDF report,
        - `pdf_errors/<name>.txt`: PDF reports that could not be created.
