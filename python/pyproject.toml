[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bauphysik-api"
dynamic = ["version"]
description = "Python client for the bauphysik.net API."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "COPYING"]
authors = [
  { name = "bauphysik.net" },
]
keywords = ["bauphysik", "building-physics", "energy-consulting", "api", "client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: German",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://bauphysik.net"
Source = "https://github.com/IB-Weichselgartner/bauphysik-api"
Issues = "https://github.com/IB-Weichselgartner/bauphysik-api/issues"

[tool.hatch.version]
path = "src/bauphysik_api/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bauphysik_api"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "COPYING"]
