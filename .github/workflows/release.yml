name: Release

# Publishes the Python client to PyPI when a tag like v0.1.0 is pushed.
# Requires a trusted publisher for this repository and the "pypi" environment
# on pypi.org.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check tag matches package version
        run: |
          version=$(python -c "exec(open('src/bauphysik_api/_version.py').read()); print(__version__)")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
